<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏆 SWIF ASIA E-SPORTS TURNAMEN 2026</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- ===== HEADER ===== -->
    <header class="header">
        <div class="header-container">
            <div class="logo-area">
                <i class="fas fa-trophy neon-icon"></i>
                <div>
                    <h1>SWIF ASIA <span>E-SPORT</span></h1>
                    <div class="subtitle">2026</div>
                </div>
            </div>
            <div class="header-right">
                <div class="date-badge">
                    <i class="fas fa-calendar-alt"></i>
                    <span id="currentDate">Loading...</span>
                </div>
                <div class="countdown-badge" id="countdownBadge">
                    <i class="fas fa-clock"></i>
                    <span id="countdownText">--</span>
                </div>
                <button class="refresh-btn" onclick="refreshData()" title="Refresh Data">
                    <i class="fas fa-sync-alt"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- ===== GAME NAVIGATION ===== -->
    <nav class="game-nav">
        <button class="game-btn active" data-game="mlbb" onclick="switchGame('mlbb')">
            <img src="https://asset.indosport.com/article/image/311815/logo_mobile_legends-169.jpg" alt="MLBB" class="game-logo">
            <div class="game-info">
                <span class="game-name">MLBB</span>
                <small class="game-date">27-31 Jul</small>
            </div>
        </button>
        <button class="game-btn" data-game="ctr" onclick="switchGame('ctr')">
            <img src="https://image.api.playstation.com/vulcan/img/cfn/113077CoZVgmIqdiQOV-nUTprqPUTjE_KK-xs8Fgl5wsuTuc5mfrPAjqjq0ReTFGQFUGHcHUsmvli6I-gBa0glXJxGgpIOa_.jpg" alt="CTR" class="game-logo">
            <div class="game-info">
                <span class="game-name">CTR</span>
                <small class="game-date">3-4 Ags</small>
            </div>
        </button>
        <button class="game-btn" data-game="pes" onclick="switchGame('pes')">
            <img src="https://wallpapers4screen.com/Uploads/14-1-2026/97748/thumb2-2026-fifa-world-cup-logo-4k-white-silk-texture-2026-fifa-world-cup-football-championship.jpg" alt="PES" class="game-logo">
            <div class="game-info">
                <span class="game-name">PES/FC</span>
                <small class="game-date">5-7 Ags</small>
            </div>
        </button>
    </nav>

    <!-- ===== MAIN CONTENT ===== -->
    <main id="contentArea">
        <div class="loading-container">
            <div class="loading-spinner"></div>
            <p>Memuat data dari spreadsheet...</p>
        </div>
    </main>

    <!-- ===== FOOTER ===== -->
    <footer class="footer">
        <div class="footer-container">
            <p>
                <i class="fas fa-database"></i> Data dari Google Spreadsheet
                <span class="divider">|</span>
                <i class="fas fa-sync-alt"></i> Auto-refresh setiap 5 menit
                <span class="divider">|</span>
                <span id="lastUpdate">Last update: --</span>
            </p>
            <p class="footer-credit">
                Made with <i class="fas fa-heart" style="color:#ff4d94;"></i> for Tournament 2026
            </p>
        </div>
    </footer>

    <!-- ===== MODAL ===== -->
    <div id="matchModal" class="modal" style="display:none;">
        <div class="modal-content neon-border">
            <div class="modal-header">
                <h3><i class="fas fa-info-circle"></i> Detail Pertandingan</h3>
                <button class="close-modal" onclick="closeModal()">&times;</button>
            </div>
            <div id="modalBody">
                <!-- Dinamis -->
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
